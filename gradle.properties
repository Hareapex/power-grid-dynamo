org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# JDK 21 compiles (with --release 17); CurseForge's Java 17 runtime (a JRE) runs the game in dev.
org.gradle.java.installations.paths=C:/Program Files/Java/jdk-21.0.12,C:/Program Files/Java/jdk-25.0.4.1,F:/Minecraft/Modpack/Install/java/java-runtime-gamma
org.gradle.java.installations.auto-download=false

minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
forge_version=47.4.28
forge_version_range=[47,)
loader_version_range=[47,)

# The mixin hooks into PowerGrid's internals, so it is pinned to the exact version it was written for.
powergrid_version_range=[0.6.2]
# Power Grid 0.6.2 for Forge 1.20.1 itself needs Create [6.0.7,6.1.0).
create_version_range=[6.0.7,6.1)

# Compile and dev-run dependencies (Forge 1.20.1 builds; the versions Create 6.0.8 is built with).
create_version=6.0.8-291
ponder_version=1.0.91
flywheel_version=1.0.6
registrate_version=MC1.20-1.3.3
architectury_version=9.2.14
# Modrinth version id of powergrid-mc1.20.1-0.6.2.jar
powergrid_modrinth_version=CBWW1upo

mod_id=pgdynamo
mod_name=Power Grid: Dynamo
archive_name=power-grid-dynamo-forge-1.20.1
mod_license=Apache-2.0
mod_version=0.1.0
mod_group_id=dev.hareapex.pgdynamo
mod_authors=Hareapex
