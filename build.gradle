plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = archive_name
}

// The game tests and their empty test structure only run from the source set; keep them out of the release jar.
tasks.named('jar', Jar) {
    exclude 'dev/hareapex/pgdynamo/gametest/**'
    exclude 'data/pgdynamo/structure/**'
}

// Minecraft 1.21.1 ships Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        // run/client/mods and run/gametest/mods hold Create, PowerGrid and Architectury, copied from the pack.
        client {
            client()
            gameDirectory = project.file('run/client')
        }
        // Headless server that runs the tests in dev.hareapex.pgdynamo.gametest and exits.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Compile against the exact jars the pack runs. Nothing is bundled: the pack already has them.
    compileOnly files(
            'libs/powergrid-mc1.21.1-0.6.2.jar',
            'libs/create-1.21.1-6.0.10.jar',
            'libs/flywheel-neoforge-1.21.1-1.0.6.jar',
            'libs/ponder-neoforge-1.0.82+mc1.21.1.jar',
            'libs/Registrate-MC1.21-1.3.0+67.jar')
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            powergrid_version_range: powergrid_version_range,
            create_version_range   : create_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
