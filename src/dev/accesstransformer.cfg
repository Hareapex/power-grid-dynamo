# Dev environment only: applied to the dev Minecraft jar by build.gradle, never packaged in the release jar.
# Power Grid's LevelEntitiesAccessor declares getEntities(), the same name Minecraft's protected Level.getEntities()
# has in Mojang names, so in dev its calls land on the protected method and the client crashes on world join
# (IllegalAccessError). In real installs Minecraft uses SRG names (m_142646_), so the names don't clash there.
# SRG names, like every Forge 1.20.1 access transformer (ServerLevel's is already public through Forge's own AT).
public net.minecraft.world.level.Level m_142646_()Lnet/minecraft/world/level/entity/LevelEntityGetter; # getEntities
public net.minecraft.client.multiplayer.ClientLevel m_142646_()Lnet/minecraft/world/level/entity/LevelEntityGetter; # getEntities
